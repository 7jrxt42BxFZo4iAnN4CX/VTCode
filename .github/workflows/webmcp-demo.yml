name: Deploy WebMCP challenge demo

permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - feat/webmcp-challenge-demo
    paths:
      - .github/workflows/webmcp-demo.yml
      - examples/webmcp-challenge/**

concurrency:
  group: webmcp-demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/webmcp-challenge/package-lock.json

      - name: Build Vite editor
        run: |
          npm ci --prefix examples/webmcp-challenge
          npm run build --prefix examples/webmcp-challenge

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: examples/webmcp-challenge/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
